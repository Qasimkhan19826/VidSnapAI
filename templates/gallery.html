{% extends "base.html" %}

{% block title %}Gallery - AI Reel Generator{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
{% endblock %}

{% block content %}
<div class="container gallery-container">
    <h1 class="gallery-title">Reel Gallery</h1>
    <div class="gallery-grid">
        <!-- 10 Example reels - these would be populated dynamically in a real application -->
        <!-- Taking all the reels in the reel ,and Show this in the gallery -->
        {% for reel in reels %}
        <video src="static/reels/{{reel}}" controls ></video>
        {% endfor %}
    </div>
</div>
{% endblock %}
